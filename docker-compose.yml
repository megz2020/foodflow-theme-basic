services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - pgdata:/var/lib/postgresql/data

  odoo17-basic:
    image: odoo:17.0
    depends_on:
      - db
    ports:
      - "8037:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./foodflow_theme_basic:/mnt/extra-addons/foodflow_theme_basic
      - odoo17-basic-data:/var/lib/odoo
    command: >
      odoo
      --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
      -d odoo17_basic
      -i foodflow_theme_basic
      --without-demo=all

  odoo18-basic:
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8019:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./foodflow_theme_basic:/mnt/extra-addons/foodflow_theme_basic
      - odoo18-basic-data:/var/lib/odoo
    command: >
      odoo
      --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
      -d odoo18_basic
      -i foodflow_theme_basic
      --without-demo=all

  odoo19-basic:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8039:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./foodflow_theme_basic:/mnt/extra-addons/foodflow_theme_basic
      - odoo19-basic-data:/var/lib/odoo
    command: >
      odoo
      --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
      -d odoo19_basic
      -i foodflow_theme_basic
      --without-demo=all

volumes:
  pgdata:
  odoo17-basic-data:
  odoo18-basic-data:
  odoo19-basic-data:
